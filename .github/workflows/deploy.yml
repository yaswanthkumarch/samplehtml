name: Deploy Next.js to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository into my-project
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          path: my-project

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Build Next.js static site
      - name: Build Next.js static site
        working-directory: my-project
        run: |
          npm install
          npm run build
          npm run export

      # Step 4: Deploy via SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            # Remove old files
            sudo rm -rf /var/www/html/*

            # Copy new build
            sudo cp -r my-project/out/* /var/www/html/

            # Set proper ownership & permissions
            sudo chown -R ${{ secrets.VM_USER }}:www-data /var/www/html
            sudo chmod -R 775 /var/www/html

            # Reload Nginx
            sudo systemctl reload nginx
